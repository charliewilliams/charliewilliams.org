<header class="site-head">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}">{{ .Site.Params.name }}</a>
    <nav class="site-nav" aria-label="Primary">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
      <a class="cta" href="mailto:{{ .Site.Params.email }}">Get in touch</a>
    </nav>
  </div>
</header>
